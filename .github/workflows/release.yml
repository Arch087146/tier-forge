name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  windows:
    name: Build, sign, and release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application (no installers)
        run: npx tauri build --no-bundle

      - name: Stage unsigned application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging\exe | Out-Null
          Copy-Item src-tauri\target\release\tier-forge.exe staging\exe\TierForge.exe

      - name: Upload unsigned application
        id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: tierforge-exe-unsigned
          path: staging/exe/TierForge.exe
          if-no-files-found: error

      - name: Sign application with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tier-forge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_EXE || 'windows-exe' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: staging/signed-exe

      - name: Use signed application
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item staging\signed-exe\TierForge.exe src-tauri\target\release\tier-forge.exe -Force

      - name: Build installers around the signed application
        run: npx tauri bundle --bundles msi,nsis --no-binary-patching

      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging\installers | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe staging\installers\TierForge-setup.exe
          Copy-Item src-tauri\target\release\bundle\msi\*.msi staging\installers\TierForge.msi

      - name: Upload unsigned installers
        id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: tierforge-installers-unsigned
          path: staging/installers/*
          if-no-files-found: error

      - name: Sign installers with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tier-forge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_INSTALLERS || 'windows-installers' }}
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: staging/signed-installers

      - name: Use signed installers
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item staging\signed-installers\TierForge-setup.exe staging\installers\TierForge-setup.exe -Force
          Copy-Item staging\signed-installers\TierForge.msi staging\installers\TierForge.msi -Force

      - name: Package release assets
        shell: pwsh
        run: |
          $config = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version

          New-Item -ItemType Directory -Force portable\TierForge | Out-Null
          Copy-Item src-tauri\target\release\tier-forge.exe portable\TierForge\TierForge.exe
          Copy-Item LICENSE portable\TierForge\LICENSE
          Compress-Archive -Path portable\TierForge -DestinationPath "TierForge_${version}_x64-portable.zip" -CompressionLevel Optimal

          Copy-Item staging\installers\TierForge-setup.exe "TierForge_${version}_x64-setup.exe"
          Copy-Item staging\installers\TierForge.msi "TierForge_${version}_x64_en-US.msi"

          Get-FileHash "TierForge_${version}_x64-setup.exe","TierForge_${version}_x64_en-US.msi","TierForge_${version}_x64-portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: tierforge-release-assets
          path: |
            TierForge_*_x64-setup.exe
            TierForge_*_x64_en-US.msi
            TierForge_*_x64-portable.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "TierForge_${version}_x64-setup.exe",
            "TierForge_${version}_x64_en-US.msi",
            "TierForge_${version}_x64-portable.zip",
            "SHA256SUMS.txt"
          )

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            $notes = "docs/release-notes-$tag.md"
            if (Test-Path $notes) {
              gh release create $tag @assets --title "TierForge $tag" --notes-file $notes
            } else {
              gh release create $tag @assets --title "TierForge $tag" --generate-notes
            }
          }
